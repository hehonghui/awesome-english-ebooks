name: Sync publication files to Cloudflare R2

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      sync_all:
        description: Re-upload every publication file and image
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publication-r2-production
  cancel-in-progress: false

env:
  R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || 'nice69' }}
  R2_OBJECT_PREFIX: publication

jobs:
  sync-r2:
    name: Sync changed publication files to R2
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upload changed files and remove deleted files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_SYNC_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_all || 'false' }}
        run: bash scripts/sync-publication-r2.sh
